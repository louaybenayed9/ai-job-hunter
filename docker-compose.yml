name: ai-job-hunter

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------
  # 1. PostgreSQL with pgvector (state store + future RAG embeddings)
  # ---------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_job_hunter}
      POSTGRES_USER: ${POSTGRES_USER:-ai_job_hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs .sql files on first boot (pgvector extension + schema)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_job_hunter} -d ${POSTGRES_DB:-ai_job_hunter}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------
  # 2. Self-hosted n8n orchestrator
  # ---------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # --- General ---
      TZ: ${TZ:-Africa/Tunis}
      GENERIC_TIMEZONE: ${TZ:-Africa/Tunis}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required - copy .env.example to .env}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: "false"
      # Expressions in workflow nodes may read process env ($env.X)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- Persistence ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-ai_job_hunter}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-ai_job_hunter}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS:-168}
      # --- Service endpoints used by workflow expressions ---
      SCRAPE_API_URL: http://scraper-service:8000
      AI_SERVICE_URL: http://ai-service:8001
      # --- Secrets consumed by workflow nodes (never hardcode in workflows) ---
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MATCH_SCORE_THRESHOLD: ${MATCH_SCORE_THRESHOLD:-75}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_SHEET_NAME: ${GOOGLE_SHEETS_SHEET_NAME:-Sheet1}
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflows below can be imported from the n8n UI (Workflows -> Import)
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # 3. Custom scraper microservice (FastAPI + BeautifulSoup/httpx)
  # ---------------------------------------------------------------
  scraper-service:
    build:
      context: ./scraper-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${SCRAPER_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCRAPE_DELAY_SECONDS: ${SCRAPE_DELAY_SECONDS:-1.0}
      SCRAPE_TIMEOUT_SECONDS: ${SCRAPE_TIMEOUT_SECONDS:-20}
      SCRAPE_MAX_PAGES: ${SCRAPE_MAX_PAGES:-3}
      USER_AGENT: ${SCRAPE_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------
  # 4. AI scoring microservice (Gemini / OpenRouter, structured JSON)
  # ---------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${AI_PORT:-8001}:8001"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      RESUME_PATH: /data/resume.md
      MATCH_SCORE_THRESHOLD: ${MATCH_SCORE_THRESHOLD:-75}
    volumes:
      # Master resume the LLM scores every job against
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  n8n_data:
